<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}img{max-width:100%}</style>
<title>Clause &amp; Effect</title>
<meta name="description" content="A live conjunctions quiz battle for Grade 10: host on a big screen, join from phones, build a character and grab power-ups.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&amp;family=Nunito:ital,wght@0,600;0,700;0,800;0,900;1,700;1,800&amp;display=swap">
<style>
:root{
  color-scheme: dark;
  --stage:#15113A; --stage-2:#211B55; --stage-3:#2D2572; --line:#3B3290; --deep:#0B0826;
  --text:#FFFFFF; --muted:#CFC9F5; --faint:#9D95D6;
  --ink:#17132F; --ink-2:#4B4670; --paper:#FFFFFF;
  --sun:#FFC42E; --sun-deep:#D69A00; --pink:#FF5FA8; --pink-deep:#C93D80; --mint:#3DDC97; --ice:#8BE6FF;
  --a:#D8293F; --b:#1F6FEB; --c:#FFC21A; --d:#0A7F4F;
  --good:#22D185; --bad:#FF5566;
  --font-display:'Lilita One','Arial Rounded MT Bold','Trebuchet MS',system-ui,sans-serif;
  --font-body:'Nunito','Segoe UI',system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--stage);color:var(--text);font-family:var(--font-body);font-weight:700;font-size:16px;line-height:1.4;-webkit-font-smoothing:antialiased;overflow-x:hidden;-webkit-tap-highlight-color:transparent}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3{text-wrap:balance}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- stage backdrop ---------- */
.bg-rays{position:fixed;left:50%;top:42%;width:280vmax;height:280vmax;margin:-140vmax 0 0 -140vmax;background:repeating-conic-gradient(rgba(255,255,255,.035) 0deg 7.5deg,rgba(255,255,255,0) 7.5deg 15deg);animation:spin 180s linear infinite;pointer-events:none;z-index:0}
.bg-glow{position:fixed;inset:0;background:radial-gradient(70vmax 50vmax at 50% 38%,rgba(139,92,255,.32),rgba(21,17,58,0) 70%);pointer-events:none;z-index:0}
#bgfx,#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
#bgfx{z-index:0}
#confetti{z-index:60}
#app{position:relative;z-index:1;min-height:100%;display:flex;flex-direction:column}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-7px) rotate(2deg)}}
@keyframes pop{0%{transform:scale(.3);opacity:0}70%{transform:scale(1.12);opacity:1}100%{transform:scale(1)}}
@keyframes rise{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
@keyframes wob{0%,100%{transform:rotate(-10deg)}50%{transform:rotate(8deg) scale(1.06)}}
@keyframes jump{0%,100%{transform:translateY(0)}30%{transform:translateY(-26px) rotate(-8deg)}60%{transform:translateY(0) rotate(4deg)}}
@keyframes shake{0%,100%{transform:none}20%{transform:translate(-6px,3px) skewX(4deg)}40%{transform:translate(5px,-4px) skewX(-6deg)}60%{transform:translate(-4px,2px)}80%{transform:translate(3px,-2px) skewX(3deg)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
@keyframes countpop{0%{transform:scale(2.4);opacity:0}25%{transform:scale(1);opacity:1}85%{opacity:1}100%{transform:scale(.7);opacity:0}}
@keyframes flipin{from{transform:perspective(600px) rotateY(80deg);opacity:0}to{transform:none;opacity:1}}
@keyframes rgb{0%,100%{text-shadow:2px 0 #ff2d6f,-2px 0 #2de2ff}50%{text-shadow:-3px 1px #ff2d6f,3px -1px #2de2ff}}

/* ---------- shared bits ---------- */
.btn{font-family:var(--font-display);font-weight:400;font-size:22px;letter-spacing:.02em;border:0;border-radius:16px;padding:14px 26px;color:var(--ink);background:var(--sun);box-shadow:0 6px 0 var(--sun-deep);transition:transform .08s,box-shadow .08s,filter .15s;display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:52px}
.btn:hover{filter:brightness(1.06)}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--sun-deep)}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.btn.ghost{background:var(--stage-3);color:#fff;box-shadow:0 6px 0 #150F4A}
.btn.ghost:active{box-shadow:0 2px 0 #150F4A}
.btn.pink{background:var(--pink);box-shadow:0 6px 0 var(--pink-deep)}
.btn.xl{font-size:28px;padding:18px 34px;min-height:64px}
.btn.full{width:100%}
.btn svg{width:22px;height:22px;flex:none}
:focus-visible{outline:4px solid #fff;outline-offset:3px}
.icon-btn{width:44px;height:44px;border-radius:12px;border:0;background:rgba(255,255,255,.1);color:#fff;display:grid;place-items:center}
.icon-btn:hover{background:rgba(255,255,255,.18)}
.icon-btn svg{width:22px;height:22px}
.icon-btn.warn{background:rgba(255,85,102,.2)}
.icon-btn.warn.armed{background:var(--bad)}
.link-back{align-self:flex-start;border:0;background:none;color:var(--muted);font-weight:800;font-size:16px;padding:10px 0;display:inline-flex;gap:6px;align-items:center}
.link-back:hover{color:#fff}
.eyebrow{font-size:13px;letter-spacing:.14em;text-transform:uppercase;font-weight:900;color:var(--faint);margin:0}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:5px 12px;font-size:14px;font-weight:900;background:var(--cc,#fff);color:var(--ink);white-space:nowrap}
.blank{display:inline-block;width:3.2em;height:.2em;border-radius:4px;background:currentColor;vertical-align:.05em;margin:0 .15em;opacity:.9}
.av{display:block;width:100%;height:auto;overflow:visible}
.bob{animation:bob 2.6s ease-in-out infinite}
.toasts{position:fixed;top:calc(env(safe-area-inset-top,0px) + 14px);right:14px;left:14px;z-index:70;display:flex;flex-direction:column;align-items:flex-end;gap:8px;pointer-events:none}
.toast{background:#fff;color:var(--ink);border-radius:14px;padding:10px 16px;font-weight:900;box-shadow:0 6px 0 rgba(0,0,0,.25);display:flex;gap:10px;align-items:center;animation:rise .25s ease-out;max-width:min(420px,100%)}
.toast .ti{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;flex:none;background:var(--tc,var(--sun))}
.toast .ti svg{width:18px;height:18px}
.netbar{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);transform:translateX(-50%);z-index:65;background:var(--bad);color:#fff;border-radius:99px;padding:8px 16px;font-weight:900;font-size:14px;box-shadow:0 5px 0 rgba(0,0,0,.3)}

/* ---------- logo ---------- */
.logo{font-family:var(--font-display);font-weight:400;line-height:.92;margin:0;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;column-gap:.12em;font-size:clamp(54px,11vw,138px);color:#fff;text-shadow:0 .06em 0 var(--deep)}
.logo .amp{color:var(--sun);font-size:1.3em;display:inline-block;animation:wob 3.2s ease-in-out infinite;text-shadow:0 .05em 0 #8F5F00}
.mini-logo{font-family:var(--font-display);font-size:24px;letter-spacing:.01em;white-space:nowrap}
.mini-logo b{color:var(--sun);font-weight:400;margin:0 2px}

/* ---------- home ---------- */
.home{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;padding-block:36px 44px;padding-inline:16px;text-align:center}
.tagline{margin:0;font-size:clamp(17px,2.3vw,23px);color:var(--muted);font-weight:800}
.tagline b{color:#fff}
.parade{display:flex;justify-content:center;gap:clamp(4px,1.5vw,18px);width:min(720px,100%)}
.parade .pa{width:clamp(52px,11vw,96px)}
.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;width:min(780px,100%)}
.choice{border:0;border-radius:26px;padding:22px 22px 24px;display:grid;grid-template-columns:auto 1fr;gap:4px 16px;align-items:center;text-align:left;color:var(--ink);box-shadow:0 8px 0 var(--sd);transition:transform .1s,box-shadow .1s}
.choice:active{transform:translateY(5px);box-shadow:0 3px 0 var(--sd)}
.choice .ci{grid-row:span 2;width:62px;height:62px;border-radius:18px;background:rgba(23,19,47,.12);display:grid;place-items:center}
.choice .ci svg{width:34px;height:34px}
.choice b{font-family:var(--font-display);font-weight:400;font-size:clamp(26px,3vw,34px);line-height:1}
.choice small{font-size:15px;font-weight:800;opacity:.8}
.choices.three{grid-template-columns:repeat(3,minmax(0,1fr));width:min(1100px,100%)}
.choices.one{grid-template-columns:minmax(0,1fr);width:min(520px,100%)}
.choices.three .choice{grid-template-columns:1fr;justify-items:start;gap:8px}
.choices.three .choice .ci{grid-row:auto}
.choice.c-local{background:var(--mint);--sd:#17A56B}
.choice.c-host{background:var(--sun);--sd:var(--sun-deep)}
.choice.c-join{background:var(--pink);--sd:var(--pink-deep)}
.how{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;justify-content:center;gap:10px;counter-reset:how}
.how li{counter-increment:how;background:rgba(255,255,255,.08);border-radius:99px;padding:8px 16px 8px 8px;font-weight:800;color:var(--muted);display:flex;align-items:center;gap:10px;font-size:15px}
.how li::before{content:counter(how);width:28px;height:28px;border-radius:50%;background:#fff;color:var(--ink);display:grid;place-items:center;font-family:var(--font-display);font-size:16px}
.netnote{display:inline-flex;align-items:center;gap:10px;font-size:14px;color:var(--faint);font-weight:800;max-width:640px;text-align:left}
.netnote .dot{width:10px;height:10px;border-radius:50%;background:var(--faint);flex:none}
.netnote.room .dot,.netnote.peer .dot{background:var(--good);box-shadow:0 0 0 4px rgba(34,209,133,.2)}
.netnote.local .dot{background:var(--sun)}

/* ---------- setup ---------- */
.screen{flex:1;display:flex;flex-direction:column;padding-inline:clamp(16px,3vw,44px)}
.setup{align-items:center;padding-block:18px 40px;gap:18px}
.setup > *{width:min(760px,100%)}
.setup-head{text-align:center;display:flex;flex-direction:column;gap:6px;align-items:center}
.setup-head h2{font-family:var(--font-display);font-weight:400;font-size:clamp(34px,5vw,52px);margin:0;line-height:1}
.setup-head p{margin:0;color:var(--muted)}
.panel{background:var(--stage-2);border:3px solid var(--line);border-radius:28px;padding:clamp(18px,3vw,30px);box-shadow:0 10px 0 rgba(0,0,0,.25)}
.setup-form{display:flex;flex-direction:column;gap:22px}
fieldset{border:0;margin:0;padding:0;display:flex;flex-direction:column;gap:10px;min-width:0}
legend{font-size:13px;letter-spacing:.14em;text-transform:uppercase;font-weight:900;color:var(--faint);padding:0;margin-bottom:10px}
.seg{display:flex;flex-wrap:wrap;gap:10px}
.seg label{position:relative}
.seg input,.chipset input,.switch input{position:absolute;opacity:0;width:1px;height:1px}
.seg span{display:inline-flex;align-items:center;justify-content:center;min-width:76px;min-height:48px;padding:0 18px;border-radius:14px;background:var(--stage-3);font-family:var(--font-display);font-size:22px;border:3px solid transparent}
.seg input:checked + span{background:#fff;color:var(--ink);border-color:var(--sun);box-shadow:0 4px 0 var(--sun-deep)}
.seg input:focus-visible + span,.chipset input:focus-visible + span,.switch input:focus-visible + .sw{outline:4px solid #fff;outline-offset:2px}
.chipset{display:flex;flex-wrap:wrap;gap:10px}
.chipset span{display:inline-flex;align-items:center;gap:8px;min-height:46px;padding:0 16px;border-radius:99px;background:var(--stage-3);border:3px solid var(--stage-3);font-weight:900;color:var(--muted)}
.chipset span::before{content:"";width:14px;height:14px;border-radius:50%;background:var(--cc);opacity:.45}
.chipset span em{font-style:normal;font-size:13px;opacity:.7}
.chipset input:checked + span{border-color:var(--cc);color:#fff;background:rgba(255,255,255,.06)}
.chipset input:checked + span::before{opacity:1}
.toggles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.switch{display:flex;align-items:center;gap:14px;background:var(--stage-3);border-radius:18px;padding:14px 16px;cursor:pointer}
.switch .sw{width:54px;height:32px;border-radius:99px;background:#15104A;position:relative;flex:none;transition:background .15s}
.switch .sw::after{content:"";position:absolute;left:4px;top:4px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .15s}
.switch input:checked + .sw{background:var(--good)}
.switch input:checked + .sw::after{transform:translateX(22px)}
.switch b{display:block;font-weight:900}
.switch small{display:block;color:var(--faint);font-size:13px}
.form-err{color:var(--bad);font-weight:900;margin:0;min-height:1.4em}

/* ---------- host frame ---------- */
.host{min-height:100%;flex:1;display:flex;flex-direction:column}
.hbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px;flex-wrap:wrap}
.hb-brand{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.code-chip{background:#fff;color:var(--ink);border-radius:12px;padding:6px 12px;font-weight:900;font-size:15px}
.code-chip b{font-family:var(--font-display);font-weight:400;font-size:20px;letter-spacing:.12em;margin-left:4px}
.hb-mid{flex:1;display:flex;justify-content:center;min-width:0}
.hb-tools{display:flex;gap:8px}
.qprog{display:flex;gap:5px;flex-wrap:wrap;justify-content:center;max-width:100%}
.qprog i{width:clamp(8px,1.4vw,18px);height:8px;border-radius:99px;background:rgba(255,255,255,.18)}
.qprog i.done{background:var(--sun)}
.qprog i.now{background:#fff;box-shadow:0 0 0 3px rgba(255,255,255,.25)}
.hfoot{display:flex;justify-content:flex-end;align-items:center;gap:14px;padding-block:16px 22px;flex-wrap:wrap}
.hfoot .spacer{flex:1}
.hfoot .hint{color:var(--faint);font-weight:800;font-size:14px}
.hfoot kbd{background:rgba(255,255,255,.12);border-radius:6px;padding:1px 7px;font-family:inherit;font-weight:900;color:#fff}

/* lobby */
.lobby{flex:1;display:grid;grid-template-columns:minmax(280px,380px) minmax(0,1fr);gap:clamp(16px,2.5vw,32px);align-items:start}
.join-card{background:var(--sun);color:var(--ink);border-radius:28px;padding:24px;display:flex;flex-direction:column;gap:14px;box-shadow:0 10px 0 var(--sun-deep);text-align:center}
.join-card .eyebrow{color:rgba(23,19,47,.65)}
.code-tiles{display:flex;justify-content:center;gap:10px}
.code-tiles span{width:clamp(54px,6vw,76px);aspect-ratio:4/5;max-width:100%;border-radius:16px;background:#fff;display:grid;place-items:center;font-family:var(--font-display);font-size:clamp(42px,5vw,62px);color:var(--ink);box-shadow:0 6px 0 rgba(23,19,47,.25);transform:rotate(var(--r))}
.join-how{font-weight:800;font-size:16px;line-height:1.45;display:flex;flex-direction:column;gap:6px}
.join-how .url{background:rgba(23,19,47,.1);border-radius:10px;padding:8px 10px;font-weight:900;word-break:break-all;font-size:15px}
.join-how .copy{align-self:center;border:0;border-radius:10px;background:var(--ink);color:#fff;font-weight:900;padding:8px 14px;min-height:40px}
.qr{background:#fff;border-radius:18px;padding:10px;align-self:center;width:min(220px,100%)}
.qr svg{display:block;width:100%;height:auto}
.lobby-players{display:flex;flex-direction:column;gap:14px;min-width:0}
.lp-head{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.lp-head h2{font-family:var(--font-display);font-weight:400;font-size:clamp(30px,3.6vw,44px);margin:0;line-height:1}
.net-chip{font-size:13px;font-weight:900;border-radius:99px;padding:6px 12px;background:rgba(255,255,255,.1);color:var(--muted)}
.pcloud{display:flex;flex-wrap:wrap;gap:14px 10px;align-content:flex-start;min-height:200px}
.pl{position:relative;width:108px;display:flex;flex-direction:column;align-items:center;gap:4px;animation:pop .45s cubic-bezier(.3,1.6,.5,1) both}
.pl .avw{width:88px}
.pl .avw.jump{animation:jump .7s ease-out}
.pl .nm{max-width:108px;background:#fff;color:var(--ink);border-radius:99px;padding:3px 10px;font-weight:900;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl.away{opacity:.45}
.pl .kick{position:absolute;top:0;right:4px;width:30px;height:30px;border-radius:50%;border:0;background:var(--bad);color:#fff;display:grid;place-items:center;opacity:0;transition:opacity .15s}
.pl:hover .kick,.pl .kick:focus-visible{opacity:1}
.pl .kick svg{width:14px;height:14px}
.botbadge{position:absolute;top:2px;left:6px;background:var(--ink);color:var(--mint);font-size:11px;font-weight:900;border-radius:6px;padding:1px 6px;letter-spacing:.05em}
.empty{border:3px dashed var(--line);border-radius:24px;padding:34px 20px;text-align:center;color:var(--faint);font-weight:800;display:flex;flex-direction:column;gap:6px;align-items:center;width:100%}
.empty b{color:#fff;font-size:20px}

/* intro */
.intro{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center}
.intro h2{font-family:var(--font-display);font-weight:400;font-size:clamp(56px,10vw,130px);line-height:.9;margin:0;animation:pop .5s cubic-bezier(.3,1.6,.5,1) both}
.intro .of{font-size:clamp(20px,2.5vw,28px);color:var(--muted);font-weight:900}
.countdown{width:clamp(110px,14vw,170px);aspect-ratio:1;max-width:100%;border-radius:50%;background:#fff;color:var(--ink);display:grid;place-items:center;font-family:var(--font-display);font-size:clamp(64px,8vw,100px);box-shadow:0 10px 0 rgba(0,0,0,.3)}
.countdown span{animation:countpop 1s ease-out both}
.countdown.still span{animation:pulse 1.2s ease-in-out infinite;display:grid;place-items:center}
.feed-col{display:flex;flex-direction:column;gap:8px;align-items:center;min-width:0}

/* question */
.hq{flex:1;display:flex;flex-direction:column;gap:clamp(12px,2vh,22px);min-height:0}
.hq-meta{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.hq-num{font-weight:900;color:var(--muted)}
.hq-card{background:#fff;color:var(--ink);border-radius:28px;padding:clamp(20px,3.2vw,40px);box-shadow:0 10px 0 rgba(0,0,0,.28);text-align:center;animation:rise .35s ease-out}
.hq-text{margin:0;font-family:var(--font-body);font-weight:900;font-size:clamp(26px,3.8vw,54px);line-height:1.18}
.hq-row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:18px}
.ring{position:relative;width:clamp(86px,9vw,120px);aspect-ratio:1;max-width:100%}
.ring svg{width:100%;height:100%;display:block}
.ring .trk{fill:none;stroke:rgba(255,255,255,.14);stroke-width:10}
.ring .arc{fill:none;stroke:var(--sun);stroke-width:10;stroke-linecap:round;transition:stroke .2s}
.ring.low .arc{stroke:var(--bad)}
.ring.low{animation:pulse .5s ease-in-out infinite}
.ring span{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--font-display);font-size:clamp(34px,3.6vw,48px)}
.answered{text-align:center;display:flex;flex-direction:column;align-items:center;min-width:90px}
.answered b{font-family:var(--font-display);font-weight:400;font-size:clamp(40px,4vw,56px);line-height:1}
.answered span{color:var(--muted);font-weight:900;font-size:14px}
.feed{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;min-height:40px}
.feed .fi{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.1);border-radius:99px;padding:5px 12px 5px 5px;font-weight:900;font-size:15px;animation:pop .35s ease-out both}
.feed .fi i{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--pc);color:var(--ink)}
.feed .fi i svg{width:16px;height:16px}
.pp-banner{background:var(--sun);color:var(--ink);border-radius:16px;padding:10px 18px;font-weight:900;display:flex;gap:10px;align-items:center;justify-content:center;animation:pop .4s ease-out both}
.pp-banner svg{width:22px;height:22px}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(10px,1.4vw,18px)}
.tile{position:relative;display:flex;align-items:center;gap:16px;min-height:clamp(74px,11vh,120px);padding:14px 20px;border-radius:22px;color:#fff;font-weight:900;font-size:clamp(20px,2.5vw,34px);line-height:1.2;box-shadow:0 7px 0 rgba(0,0,0,.28);animation:rise .4s ease-out both;transition:opacity .3s,transform .3s,filter .3s}
.tiles.long .tile{font-size:clamp(17px,1.8vw,26px)}
.tile:nth-child(2){animation-delay:.06s}.tile:nth-child(3){animation-delay:.12s}.tile:nth-child(4){animation-delay:.18s}
.tile .let{flex:none;width:clamp(42px,4vw,56px);aspect-ratio:1;border-radius:14px;background:rgba(255,255,255,.22);display:grid;place-items:center;font-family:var(--font-display);font-weight:400;font-size:.95em}
.tile .tx{min-width:0;overflow-wrap:anywhere}
.t0{background:var(--a)}.t1{background:var(--b)}.t2{background:var(--c);color:var(--ink)}.t3{background:var(--d)}
.t2 .let{background:rgba(23,19,47,.14)}
.tile .cnt{margin-left:auto;display:flex;align-items:center;gap:8px;font-family:var(--font-display);font-weight:400;font-size:.95em;flex:none}
.tile.dim{opacity:.3;filter:saturate(.5);transform:scale(.97)}
.tile.right{transform:scale(1.03);box-shadow:0 0 0 5px #fff,0 9px 0 rgba(0,0,0,.3)}
.tile .ok{width:36px;height:36px;border-radius:50%;background:#fff;color:var(--d);display:grid;place-items:center}
.tile .ok svg{width:22px;height:22px}
.why{background:var(--stage-2);border:3px solid var(--line);border-radius:22px;padding:16px 20px;display:flex;gap:14px;align-items:flex-start;font-size:clamp(17px,1.8vw,22px);animation:rise .4s .2s ease-out both}
.why b{color:var(--sun)}
.why .wi{flex:none;width:40px;height:40px;border-radius:12px;background:var(--sun);color:var(--ink);display:grid;place-items:center}
.why .wi svg{width:22px;height:22px}
.score-line{font-weight:900;color:var(--muted);font-size:18px;text-align:center}
.score-line b{color:#fff}

/* board */
.boardwrap{flex:1;display:grid;grid-template-columns:minmax(0,1fr) minmax(220px,300px);gap:clamp(16px,2.5vw,32px);align-items:start}
.board-title{font-family:var(--font-display);font-weight:400;font-size:clamp(36px,4.6vw,60px);margin:0 0 14px;line-height:1}
.board{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.row{display:grid;grid-template-columns:48px 60px minmax(0,1fr) auto auto;align-items:center;gap:14px;background:var(--stage-2);border:3px solid var(--line);border-radius:20px;padding:8px 18px 8px 10px;animation:rise .4s ease-out both}
.row.r1{border-color:#FFC42E;background:#2B2362}.row.r2{border-color:#C9D3E6}.row.r3{border-color:#E08A4B}
.row .rk{font-family:var(--font-display);font-size:30px;text-align:center}
.row .rav{width:56px}
.row .rn{font-weight:900;font-size:clamp(18px,1.8vw,24px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:8px;min-width:0}
.row .rn span{overflow:hidden;text-overflow:ellipsis}
.row .mv{font-size:13px;font-weight:900;color:var(--good);flex:none}
.row .mv.down{color:var(--bad)}
.row .gain{font-weight:900;color:var(--good);font-size:16px;white-space:nowrap}
.row .gain.neg{color:var(--bad)}
.row .sc{font-family:var(--font-display);font-size:clamp(24px,2.4vw,32px);font-variant-numeric:tabular-nums;min-width:90px;text-align:right}
.flame{display:inline-flex;align-items:center;gap:2px;color:#FF8A3D;font-weight:900;font-size:14px;flex:none}
.flame svg{width:16px;height:16px}
.side-card{background:var(--stage-2);border:3px solid var(--line);border-radius:24px;padding:20px;display:flex;flex-direction:column;gap:12px}
.side-card h3{margin:0;font-family:var(--font-display);font-weight:400;font-size:26px;line-height:1.1}
.side-card p{margin:0;color:var(--muted)}
.meter{height:14px;border-radius:99px;background:rgba(255,255,255,.1);overflow:hidden}
.meter i{display:block;height:100%;background:var(--good);border-radius:99px;transition:width .3s}
.pw-mini{display:flex;flex-wrap:wrap;gap:6px}
.pw-mini span{width:34px;height:34px;border-radius:10px;background:var(--pc);color:var(--ink);display:grid;place-items:center}
.pw-mini span svg{width:18px;height:18px}

/* podium */
.podium-wrap{flex:1;display:flex;flex-direction:column;align-items:center;gap:22px;padding-top:8px}
.podium-title{font-family:var(--font-display);font-weight:400;font-size:clamp(40px,6vw,76px);margin:0;line-height:1;text-align:center}
.podium{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));align-items:end;gap:clamp(8px,2vw,24px);width:min(900px,100%)}
.pod{display:flex;flex-direction:column;align-items:center;gap:8px;opacity:0;transform:translateY(40px);transition:opacity .5s,transform .6s cubic-bezier(.3,1.4,.5,1)}
.pod.show{opacity:1;transform:none}
.pod .pav{width:min(120px,78%)}
.pod .crown{width:min(58px,40%);display:block;margin-bottom:-14px;animation:bob 2.4s ease-in-out infinite}
.pod .pname{font-weight:900;font-size:clamp(16px,2vw,24px);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pod .pscore{font-family:var(--font-display);font-size:clamp(20px,2.4vw,30px);color:var(--sun);font-variant-numeric:tabular-nums}
.pod .block{width:100%;border-radius:20px 20px 0 0;display:grid;place-items:start center;padding-top:12px;font-family:var(--font-display);font-size:clamp(40px,6vw,76px);color:var(--ink);box-shadow:inset 0 -12px 0 rgba(0,0,0,.12)}
.pod.p1 .block{height:clamp(120px,19vh,200px);background:var(--sun)}
.pod.p2 .block{height:clamp(90px,13vh,146px);background:#DDE3F0}
.pod.p3 .block{height:clamp(64px,9vh,104px);background:#F09A5B}
.rest{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;width:min(900px,100%)}
.rest span{background:var(--stage-2);border-radius:99px;padding:6px 14px;font-weight:900;color:var(--muted)}
.rest span b{color:#fff}
.stats{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.stat{background:var(--stage-2);border:3px solid var(--line);border-radius:20px;padding:12px 18px;min-width:180px;text-align:center}
.stat b{display:block;font-family:var(--font-display);font-weight:400;font-size:32px;color:var(--sun)}
.stat span{color:var(--muted);font-weight:800;font-size:14px}

/* ---------- player ---------- */
.pwrap{width:min(560px,100%);margin:0 auto;flex:1;display:flex;flex-direction:column;gap:16px;padding-block:14px 26px;padding-inline:16px}
.ptop{display:flex;align-items:center;gap:10px;min-height:48px}
.ptop .me{display:flex;align-items:center;gap:8px;min-width:0;flex:1}
.ptop .me .avw{width:42px;flex:none}
.ptop .me b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ptop .pts{font-family:var(--font-display);font-size:24px;font-variant-numeric:tabular-nums;background:rgba(255,255,255,.1);border-radius:12px;padding:4px 12px}
.center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center}
.bigtitle{font-family:var(--font-display);font-weight:400;font-size:clamp(34px,9vw,52px);line-height:1;margin:0}
.sub{margin:0;color:var(--muted);font-weight:800}
.code-input{width:100%;text-align:center;font-family:var(--font-display);font-size:clamp(44px,13vw,64px);letter-spacing:.3em;text-indent:.3em;text-transform:uppercase;background:#fff;color:var(--ink);border:0;border-radius:22px;padding:14px 10px;box-shadow:0 7px 0 rgba(0,0,0,.28)}
.code-input::placeholder{color:#C8C3E3}
.text-input{width:100%;background:#fff;color:var(--ink);border:3px solid transparent;border-radius:16px;padding:12px 16px;font-size:20px;font-weight:900;min-height:56px}
.text-input:focus{border-color:var(--sun);outline:none}
.err{color:var(--bad);font-weight:900;margin:0;min-height:1.4em}
.spot{width:min(200px,52vw);aspect-ratio:1;max-width:100%;border-radius:50%;background:radial-gradient(circle at 50% 60%,rgba(255,255,255,.18),rgba(255,255,255,.04) 62%,transparent 63%);display:grid;place-items:center;margin:0 auto}
.spot .avw{width:78%}
.name-row{display:flex;gap:10px}
.name-row .text-input{flex:1;min-width:0}
.dice{flex:none;width:56px;height:56px;border-radius:16px;border:0;background:var(--pink);color:var(--ink);display:grid;place-items:center;box-shadow:0 5px 0 var(--pink-deep)}
.dice:active{transform:translateY(3px);box-shadow:0 2px 0 var(--pink-deep)}
.dice svg{width:28px;height:28px}
.tabs{display:flex;flex-wrap:wrap;gap:6px}
.tabs button{flex:none;border:0;border-radius:99px;padding:8px 14px;min-height:40px;background:rgba(255,255,255,.1);color:var(--muted);font-weight:900}
.tabs button[aria-selected="true"]{background:#fff;color:var(--ink)}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(68px,1fr));gap:8px}
.opt{border:3px solid transparent;background:var(--stage-2);border-radius:16px;padding:6px;aspect-ratio:1;display:grid;place-items:center;max-width:100%}
.opt[aria-pressed="true"]{border-color:var(--sun);background:var(--stage-3)}
.opt .avw{width:100%}
.opt.sw{padding:10px}
.opt.sw i{width:100%;height:100%;border-radius:50%;background:var(--sc);box-shadow:inset 0 -5px 0 rgba(0,0,0,.2)}
.opt .none{font-weight:900;color:var(--faint);font-size:13px}
.row-btns{display:flex;gap:10px}
.row-btns .btn{flex:1;font-size:20px;padding:12px 14px}
.tbar{height:14px;border-radius:99px;background:rgba(255,255,255,.12);overflow:hidden}
.tbar i{display:block;height:100%;width:100%;background:var(--sun);border-radius:99px;transform-origin:left center}
.tbar.low i{background:var(--bad)}
.frozen .tbar i{background:var(--ice)}
.frozen{box-shadow:inset 0 0 0 6px rgba(139,230,255,.5)}
.pq-text{margin:0;font-weight:900;font-size:clamp(21px,5.6vw,28px);line-height:1.22;text-align:center;background:#fff;color:var(--ink);border-radius:22px;padding:18px 16px;box-shadow:0 7px 0 rgba(0,0,0,.25)}
.answers{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.answers.long{grid-template-columns:1fr}
.ans{min-height:96px;border:0;border-radius:20px;padding:12px 14px;color:#fff;font-weight:900;font-size:18px;line-height:1.25;display:flex;align-items:center;gap:12px;text-align:left;box-shadow:0 6px 0 rgba(0,0,0,.3);transition:transform .08s,box-shadow .08s,opacity .2s}
.answers.long .ans{min-height:70px}
.ans:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.3)}
.ans .let{flex:none;width:40px;height:40px;border-radius:12px;background:rgba(255,255,255,.22);display:grid;place-items:center;font-family:var(--font-display);font-weight:400;font-size:22px}
.ans.t2 .let{background:rgba(23,19,47,.14)}
.ans .ans-text{min-width:0;overflow-wrap:anywhere}
.ans:disabled{opacity:.22;filter:grayscale(.9);cursor:not-allowed;transform:none}
.ans:disabled .ans-text{text-decoration:line-through}
.banner{border-radius:16px;padding:10px 14px;font-weight:900;display:flex;align-items:center;gap:10px;justify-content:center;text-align:center}
.banner svg{width:22px;height:22px;flex:none}
.banner.good{background:var(--good);color:var(--ink)}
.banner.sun{background:var(--sun);color:var(--ink)}
.banner.ice{background:var(--ice);color:var(--ink)}
.pack{background:var(--stage-2);border:3px solid var(--line);border-radius:22px;padding:12px;display:flex;flex-direction:column;gap:10px}
.pack-head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.pack-head b{font-family:var(--font-display);font-weight:400;font-size:20px}
.pack-head span{color:var(--faint);font-size:13px;font-weight:800}
.slots{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.slot{border:0;border-radius:16px;min-height:78px;padding:8px 6px;background:var(--pc,transparent);color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-weight:900;font-size:13px;line-height:1.1;text-align:center;box-shadow:0 5px 0 rgba(0,0,0,.28)}
.slot svg{width:28px;height:28px}
.slot.empty{background:transparent;border:3px dashed var(--line);box-shadow:none;color:var(--faint);font-weight:800}
.slot:disabled{opacity:.45;cursor:not-allowed}
.slot:not(:disabled):not(.empty):active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.28)}
.active-pw{display:flex;align-items:center;gap:10px;justify-content:center;background:var(--pc);color:var(--ink);border-radius:14px;padding:8px 12px;font-weight:900}
.active-pw svg{width:20px;height:20px}
.verdict{font-family:var(--font-display);font-weight:400;font-size:clamp(46px,14vw,74px);line-height:1;margin:0;animation:pop .5s cubic-bezier(.3,1.6,.5,1) both}
.verdict.good{color:var(--good)}.verdict.bad{color:var(--bad)}.verdict.meh{color:var(--sun)}
.gainbig{font-family:var(--font-display);font-size:clamp(40px,11vw,60px);line-height:1}
.lines{width:100%;background:var(--stage-2);border-radius:18px;padding:12px 16px;display:flex;flex-direction:column;gap:6px}
.lines div{display:flex;justify-content:space-between;gap:10px;font-weight:800;color:var(--muted)}
.lines div b{color:#fff;font-variant-numeric:tabular-nums}
.rankpill{background:#fff;color:var(--ink);border-radius:99px;padding:8px 18px;font-weight:900;font-size:18px}
.cards{display:grid;gap:12px;width:100%}
.pw-card{border:3px solid var(--pc);background:var(--stage-2);border-radius:22px;padding:14px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 14px;align-items:center;text-align:left;color:#fff;animation:flipin .5s ease-out both;box-shadow:0 6px 0 rgba(0,0,0,.25)}
.pw-card:nth-child(2){animation-delay:.12s}.pw-card:nth-child(3){animation-delay:.24s}
.pw-card:active{transform:translateY(3px)}
.pw-card .ico{grid-row:span 3;width:64px;height:64px;border-radius:18px;background:var(--pc);color:var(--ink);display:grid;place-items:center}
.pw-card .ico svg{width:36px;height:36px}
.pw-card b{font-family:var(--font-display);font-weight:400;font-size:22px;line-height:1.05}
.pw-card small{color:var(--muted);font-weight:800;font-size:14px;line-height:1.3}
.rar{justify-self:start;font-size:11px;font-weight:900;letter-spacing:.1em;text-transform:uppercase;border-radius:6px;padding:2px 7px;color:var(--ink)}
.rar.common{background:var(--mint)}.rar.rare{background:#7FB2FF}.rar.epic{background:var(--sun)}
.medal{width:120px;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;font-family:var(--font-display);font-size:56px;color:var(--ink);background:var(--mc,#fff);box-shadow:0 8px 0 rgba(0,0,0,.3)}
.sheet-back{position:fixed;inset:0;background:rgba(8,5,30,.6);z-index:80}
.sheet{position:fixed;left:0;right:0;bottom:0;margin:0 auto;width:min(560px,100%);z-index:81;background:var(--stage-2);border:3px solid var(--line);border-bottom:0;border-radius:28px 28px 0 0;padding:22px 18px calc(22px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px;animation:rise .25s ease-out}
.sheet .pw-card{animation:none;box-shadow:none}
.wave-btn{border:0;background:rgba(255,255,255,.1);color:#fff;border-radius:99px;padding:10px 20px;font-weight:900;min-height:44px}

/* glitch */
body.glitching #app{animation:shake .25s linear infinite}
body.glitching .tile .tx,body.glitching .hq-text,body.glitching .ans-text,body.glitching .pq-text{animation:rgb .18s steps(2) infinite}
body.glitching .tiles,body.glitching .answers{filter:hue-rotate(80deg) contrast(1.2)}
.host.shake{animation:shake .3s linear 2}

/* ---------- single-device game ---------- */
.play-btn{font-size:clamp(28px,4vw,40px);padding:20px 56px;min-height:78px;border-radius:22px}
.sub.small{font-size:14px;color:var(--faint)}
.setup.wide > *{width:min(1120px,100%)}
.setup.wide .start-btn{width:auto;align-self:center;min-width:min(420px,100%)}
.setup-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:20px;align-items:start}
.roster-panel{display:flex;flex-direction:column;gap:20px}
.roster{display:flex;flex-direction:column;gap:10px}
.rrow{display:grid;grid-template-columns:72px minmax(0,1fr) auto auto;align-items:center;gap:12px;background:var(--stage-3);border-radius:20px;padding:8px 12px 8px 8px}
.rav-btn{border:0;background:rgba(255,255,255,.06);border-radius:16px;padding:4px;width:72px}
.rav-btn .avw{width:100%}
.rinfo{display:flex;flex-direction:column;min-width:0}
.rinfo b{font-size:20px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rinfo span{font-size:13px;color:var(--faint);font-weight:800}
.btn.sm{font-size:17px;padding:8px 14px;min-height:44px;border-radius:12px;box-shadow:0 4px 0 #150F4A}
.add-player{border:3px dashed var(--line);background:none;border-radius:20px;min-height:64px;font-weight:900;font-size:18px;color:var(--muted)}
.add-player:hover{border-color:var(--sun);color:#fff}
.hint-line{margin:0;color:var(--faint);font-size:14px;font-weight:800}
.turn-head{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:16px}
.who{display:flex;align-items:center;gap:12px;min-width:0}
.who .avw{width:clamp(52px,5vw,68px);flex:none}
.who div{display:flex;flex-direction:column;min-width:0}
.who b{font-family:var(--font-display);font-weight:400;font-size:clamp(24px,2.6vw,34px);line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who span{color:var(--muted);font-weight:900;font-size:14px;text-transform:uppercase;letter-spacing:.08em}
.who.big{justify-content:center}
.who.big .avw{width:clamp(70px,8vw,96px)}
.who-score{justify-self:end;text-align:right;display:flex;flex-direction:column}
.who-score b{font-family:var(--font-display);font-weight:400;font-size:clamp(28px,3vw,40px);line-height:1;font-variant-numeric:tabular-nums}
.who-score span{color:var(--muted);font-weight:900;font-size:13px}
.ring .arc{transition:stroke-dashoffset .1s linear,stroke .2s}
.ring.frozen .arc{stroke:var(--ice)}
.turn.frozen .hq-card{box-shadow:0 0 0 5px var(--ice),0 10px 0 rgba(0,0,0,.28)}
button.tile{border:0;width:100%;text-align:left;cursor:pointer;font-family:inherit;transition:transform .1s,filter .15s,opacity .2s,box-shadow .1s}
button.tile:hover:not(:disabled){filter:brightness(1.08);transform:translateY(-2px)}
button.tile:active:not(:disabled){transform:translateY(4px);box-shadow:0 3px 0 rgba(0,0,0,.28)}
button.tile:disabled{opacity:.22;filter:grayscale(.85);cursor:not-allowed;animation:none}
button.tile:disabled .tx{text-decoration:line-through}
.locked-tile{width:min(620px,100%);animation:pop .4s ease-out both}
.handoff .spot{width:min(220px,50vw)}
.tail{margin-left:auto;display:flex;align-items:center;gap:10px;flex:none}
.pickers{display:flex;flex-wrap:wrap;gap:2px;justify-content:flex-end;max-width:180px}
.pk{width:clamp(30px,2.6vw,40px);display:block}
.pk .av{filter:drop-shadow(0 2px 0 rgba(0,0,0,.25))}
.res-list{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.res{display:flex;align-items:center;gap:8px;background:var(--stage-2);border:3px solid var(--line);border-radius:99px;padding:3px 14px 3px 4px;font-weight:900}
.res .avw{width:34px}
.res b{font-variant-numeric:tabular-nums}
.res.good{border-color:var(--good)}.res.good b{color:var(--good)}
.res.bad b{color:var(--muted)}
.res em,.cpu{font-style:normal;font-size:11px;font-weight:900;letter-spacing:.06em;background:var(--ink);color:var(--mint);border-radius:6px;padding:1px 6px}
.draft{flex:1;display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center;padding-top:8px}
.cards.three{grid-template-columns:repeat(3,minmax(0,1fr));width:min(1000px,100%)}
.cards.three .pw-card{grid-template-columns:1fr;justify-items:center;text-align:center;padding:22px 16px}
.cards.three .pw-card .ico{grid-row:auto;width:84px;height:84px}
.cards.three .pw-card .ico svg{width:46px;height:46px}
.cards.three .pw-card .rar{justify-self:center}
.cards.three .pw-card b{font-size:26px}
.cards.three .pw-card:hover{border-color:#fff;transform:translateY(-3px)}
.stat.pstat{display:flex;align-items:center;gap:12px;text-align:left}
.stat.pstat .avw{width:48px;flex:none}
.stat.pstat b{font-family:var(--font-body);font-weight:900;font-size:18px;color:#fff}
@media (max-width:900px){
  .choices.three{grid-template-columns:1fr}
  .choices.three .choice{grid-template-columns:auto 1fr;gap:4px 16px}

  .cards.three{grid-template-columns:1fr}
  .cards.three .pw-card{grid-template-columns:auto minmax(0,1fr);justify-items:start;text-align:left;padding:14px}

  .cards.three .pw-card .ico svg{width:36px;height:36px}
  .cards.three .pw-card .rar{justify-self:start}
  .cards.three .pw-card b{font-size:22px}

  .hq-row{grid-template-columns:auto minmax(0,1fr) auto}
}
@media (max-width:620px){
  .turn-head{grid-template-columns:minmax(0,1fr) auto}
  .turn-head .who-score{display:none}
  .rrow{grid-template-columns:60px minmax(0,1fr) auto auto;gap:8px}
  .rav-btn{width:60px}
  .pickers{max-width:110px}
  .choices,.toggles{grid-template-columns:1fr}

  .bg-rays,.logo .amp,.bob,.ring.low{animation:none}

function drawPowerups(frac) {
  const w = frac >= 0.5 ? { common: 30, rare: 45, epic: 25 } : { common: 52, rare: 36, epic: 12 };
  const ids = Object.keys(POWERUPS), out = [];
  let guard = 0;
  while (out.length < 3 && guard++ < 50) {
    let r = Math.random() * 100, rar = 'common';
    if (r >= w.common) rar = r < w.common + w.rare ? 'rare' : 'epic';
    const pool = ids.filter(id => POWERUPS[id].rarity === rar && !out.includes(id));
    if (pool.length) out.push(pick(pool));

  return out;
}

/* =========================================================
   Online play: a tiny MQTT-over-WebSocket client and free public relays.
   Works the same in Android Chrome, iPhone Safari and desktop browsers.
   ========================================================= */
const BROKERS = [
  { url: 'wss://broker.emqx.io:8084/mqtt' },
  { url: 'wss://broker.hivemq.com:8884/mqtt' },
  { url: 'wss://test.mosquitto.org:8081/mqtt' },
  { url: 'wss://public.cloud.shiftr.io', username: 'public', password: 'public' },
];
const TOPIC = code => 'clause-effect/v2/' + code;
const TE = new TextEncoder(), TD = new TextDecoder();
const utf8Len = s => TE.encode(s).length;
function mqStr(s) { const b = TE.encode(s); const o = new Uint8Array(b.length + 2); o[0] = b.length >> 8; o[1] = b.length & 255; o.set(b, 2); return o; }
function mqCat(parts) { let n = 0; for (const p of parts) n += p.length; const o = new Uint8Array(n); let i = 0; for (const p of parts) { o.set(p, i); i += p.length; } return o; }
function mqPacket(head, body) { const len = []; let n = body.length; do { let d = n % 128; n = Math.floor(n / 128); if (n > 0) d |= 128; len.push(d); } while (n > 0); return mqCat([Uint8Array.of(head, ...len), body]); }

class MiniMqtt {
  constructor(url, opts = {}) { this.url = url; this.opts = opts; this.subs = new Set(); this.handlers = []; this.connected = false; this.closed = false; this.auto = false; this.tries = 0; this.pid = 1; this.onstate = null; }
  onMessage(fn) { this.handlers.push(fn); }
  connect(timeout = 8000) {
    return new Promise((res, rej) => {
      let done = false; const fin = (ok, e) => { if (done) return; done = true; clearTimeout(t); ok ? res(this) : rej(e); };
      const t = setTimeout(() => { fin(false, { type: 'timeout' }); if (!this.connected) this.close(); }, timeout);
      this.okCb = () => fin(true); this.failCb = e => fin(false, e);
      this.open();
    });
  }
  open() {
    if (this.closed) return;
    let ws; try { ws = new WebSocket(this.url, ['mqtt']); } catch (e) { this.fail(e); return; }
    this.ws = ws; ws.binaryType = 'arraybuffer'; this.buf = new Uint8Array(0);
    ws.onopen = () => {
      const o = this.opts, flags = 0x02 | (o.username ? 0x80 : 0) | (o.password ? 0x40 : 0);
      const parts = [mqStr('MQTT'), Uint8Array.of(4, flags, 0, 60), mqStr(o.clientId || ('ce' + uid()))];
      if (o.username) parts.push(mqStr(o.username)); if (o.password) parts.push(mqStr(o.password));
      this.raw(mqPacket(0x10, mqCat(parts)));
    };
    ws.onmessage = ev => { if (ev.data instanceof ArrayBuffer) this.feed(new Uint8Array(ev.data)); };
    ws.onerror = () => {};
    ws.onclose = () => {
      const was = this.connected; this.connected = false; clearInterval(this.pingT);
      if (this.ws === ws) this.ws = null;
      if (was && this.onstate) this.onstate(false);
      if (!was) this.fail({ type: 'closed' });
      if (this.auto && !this.closed) { const d = Math.min(8000, 1000 * Math.pow(1.6, this.tries++)); setTimeout(() => this.open(), d); }
    };
  }
  fail(e) { if (this.failCb) { const f = this.failCb; this.failCb = null; this.okCb = null; f(e); } }
  feed(chunk) {
    const b = new Uint8Array(this.buf.length + chunk.length); b.set(this.buf); b.set(chunk, this.buf.length); this.buf = b;
    for (;;) {
      const buf = this.buf; if (buf.length < 2) return;
      let mult = 1, len = 0, i = 1, byte;
      do { if (i >= buf.length) return; byte = buf[i++]; len += (byte & 127) * mult; mult *= 128; } while ((byte & 128) && i < 5);
      if (buf.length < i + len) return;
      this.handle(buf[0] >> 4, buf[0] & 15, buf.subarray(i, i + len));
      this.buf = buf.slice(i + len);
    }
  }
  handle(type, flags, body) {
    if (type === 2) {
      if (body[1] === 0) {
        this.connected = true; this.auto = true; this.tries = 0;
        for (const t of this.subs) this.sendSub(t);
        clearInterval(this.pingT); this.pingT = setInterval(() => this.raw(Uint8Array.of(0xC0, 0)), 25000);
        if (this.okCb) { const f = this.okCb; this.okCb = null; this.failCb = null; f(); }
        if (this.onstate) this.onstate(true);
      } else { this.fail({ type: 'refused' }); try { this.ws && this.ws.close(); } catch (e) {} }
    } else if (type === 3) {
      const tl = (body[0] << 8) | body[1], topic = TD.decode(body.subarray(2, 2 + tl));
      let off = 2 + tl; if ((flags >> 1) & 3) off += 2;
      const text = TD.decode(body.subarray(off));
      for (const h of this.handlers) { try { h(topic, text); } catch (e) {} }
    }
  }
  raw(bytes) { const ws = this.ws; if (ws && ws.readyState === 1) { try { ws.send(bytes); } catch (e) {} } }
  sendSub(topic) { const id = this.pid = (this.pid % 65000) + 1; this.raw(mqPacket(0x82, mqCat([Uint8Array.of(id >> 8, id & 255), mqStr(topic), Uint8Array.of(0)]))); }
  subscribe(topic) { this.subs.add(topic); if (this.connected) this.sendSub(topic); }
  publish(topic, text) { if (!this.connected) return false; this.raw(mqPacket(0x30, mqCat([mqStr(topic), TE.encode(text)]))); return true; }
  close() { this.closed = true; this.auto = false; clearInterval(this.pingT); try { this.raw(Uint8Array.of(0xE0, 0)); this.ws && this.ws.close(); } catch (e) {} this.fail({ type: 'closed' }); }
}

class OnlineNet {
  constructor(brokers) { this.kind = 'online'; this.brokers = brokers; this.clients = []; this.client = null; this.locked = null; this.q = new Map(); this.flushT = 0; }
  race(onMsg) {
    return new Promise((res, rej) => {
      let fails = 0, won = false;
      this.brokers.forEach(b => {
        const c = new MiniMqtt(b.url, { clientId: 'ce' + uid(), username: b.username, password: b.password });
        c.onMessage((t, p) => onMsg(c, t, p)); this.clients.push(c);
        c.connect(9000).then(() => { if (!won) { won = true; res(c); } }).catch(() => { if (++fails === this.brokers.length && !won) rej({ type: 'offline' }); });
      });
    });
  }
  async hostStart(code, onPlayer) {
    this.leave(); this.code = code; const t = TOPIC(code) + '/p';
    const c = await this.race((cl, topic, text) => {
      if (cl !== this.client || topic !== t) return;
      let d; try { d = JSON.parse(text); } catch (e) { return; }

    });
    this.client = c; this.clients.filter(x => x !== c).forEach(x => x.close()); this.clients = [c];
    c.subscribe(t);
    c.onstate = ok => App.netState(ok);
  }
  send(obj) { if (this.client) this.client.publish(TOPIC(this.code) + '/h', JSON.stringify(obj)); }
  pub(s) { this.send({ code: this.code, k: 'pub', s }); }
  priv(pid, m) { this.q.set(pid, m); if (!this.flushT) this.flushT = setTimeout(() => this.flush(), 60); }
  flush() {

    for (const [pid, m] of this.q) { const n = utf8Len(JSON.stringify(m)) + pid.length + 8; if (size + n > 24000 && size) { this.send({ code: this.code, k: 'priv', b: batch }); batch = {}; size = 0; } batch[pid] = m; size += n; }
    if (size) this.send({ code: this.code, k: 'priv', b: batch });
    this.q.clear();
  }
  fx(f) { this.send({ code: this.code, k: 'fx', f }); }
  async playerJoin(code, onHost) {
    this.leave(); this.code = code; const t = TOPIC(code) + '/h';
    const handler = (cl, topic, text) => {
      if (topic !== t) return;
      let d; try { d = JSON.parse(text); } catch (e) { return; }
      if (!d || typeof d !== 'object' || d.code !== code) return;

  leave() { clearTimeout(this.flushT); this.flushT = 0; this.q.clear(); this.clients.forEach(c => c.close()); this.clients = []; this.client = null; this.locked = null; }
}

  },
  startQuestion(i) {
    this.clearTimers();
    this.qi = i; this.phase = 'intro'; this.answers.clear(); this.used.clear(); this.counts = [0, 0, 0, 0]; this.powerplay = null; this.feedItems = [];
    for (const p of this.players.values()) { p.hide = []; p.result = null; p.draft = null; p.picked = false; }
    this.publish(); this.sendAllMe(); this.renderIntro(); Sound.play('whoosh'); Music.bpm = 116;
    this.introT = setTimeout(() => this.beginQuestion(), 3300);
  },
  beginQuestion() {
    if (this.phase !== 'intro') return; clearTimeout(this.introT);
    const T = this.settings.time * 1000;
    this.phase = 'question'; this.qStart = Date.now(); this.deadline = this.qStart + T; this.lastSec = -1;
    this.publish(); this.sendAllMe(); this.renderQuestion(); this.scheduleBots(); Music.bpm = 132;
    const tick = () => { if (this.phase !== 'question') return; const rem = Math.max(0, this.deadline - Date.now()); this.drawRing(rem); if (rem <= 0) { this.reveal(); return; } this.raf = requestAnimationFrame(tick); };
    this.raf = requestAnimationFrame(tick);

  },
  reveal() {
    if (this.phase !== 'question') return;
    this.clearTimers();
    const q = this.questions[this.qi], limit = this.settings.time * 1000;
    this.prevRank = this.rankMap();
    let right = 0, total = 0;
    for (const p of this.players.values()) {
      const a = this.answers.get(p.pid), pw = this.used.get(p.pid) || null, ok = !!(a && a.final && a.correct);
      const lines = []; let gained = 0;
      if (ok) {
        const streak = p.streak + 1, speed = pw === 'freeze' ? 500 : Math.round(500 * clamp(1 - a.ms / limit, 0, 1)), sb = Math.min(streak - 1, 5) * 60;
        lines.push(['Correct answer', '+500']); lines.push([pw === 'freeze' ? 'Speed bonus (frozen)' : 'Speed bonus', '+' + speed]); if (sb) lines.push(['Streak ×' + streak, '+' + sb]);
        let mult = 1;
        if (pw === 'double') { mult *= 2; lines.push(['Double Points', '×2']); }
        if (pw === 'jeopardy') { mult *= 2; lines.push(['Double Jeopardy', '×2']); }
        if (this.powerplay) { mult *= 1.5; lines.push(['Power Play', '×1.5']); }
        if (a.attempts > 1) lines.push(['Saved by Immunity', '✓']);
        gained = Math.round((500 + speed + sb) * mult); p.streak = streak; p.best = Math.max(p.best, streak); p.correct++;

      }
      p.score = Math.max(0, p.score + gained);
      p.result = { ok, gained, lines, choice: a && a.final ? a.choice : null, none: !(a && a.final), pw };
      if (this.isActive(p) || (a && a.final)) { total++; if (ok) right++; }
    }
    this.qStats[this.qi] = { text: q.q, pct: total ? right / total : 0, right, total };

    this.publish(); this.sendAllMe(); this.renderReveal(); Sound.play('reveal');
  },
  toBoard() {
    if (this.phase !== 'reveal') return;
    if (this.qi >= this.questions.length - 1) { this.podium(); return; }
    this.phase = 'board';
    if (this.settings.powers) {
      const r = this.ranked();
      r.forEach((p, i) => { p.draft = drawPowerups(r.length > 1 ? i / (r.length - 1) : 0); p.picked = false; });
      for (const p of r) if (p.bot) this.botT.push(setTimeout(() => this.onPick(p, { qi: this.qi, i: ri(3) }), rnd(900, 2800)));
    }

  },
  podium() {
    this.clearTimers(); this.phase = 'podium'; Music.stop();
    this.publish(); this.sendAllMe(); this.renderPodium();
  },
  skip() {

      for (const [pid, pw] of this.used) { const p = this.players.get(pid); if (p && pw !== 'gift' && p.inv.length < 3) p.inv.push(pw); }

  primary() {

    else if (ph === 'reveal') this.toBoard();
    else if (ph === 'board') this.startQuestion(this.qi + 1);
  },
  endGame() { if (this.qPlayed) this.podium(); else this.backToLobby(); },
  backToLobby() {
    this.clearTimers(); this.phase = 'lobby'; this.qi = -1; this.questions = [];

  },
  kick(pid) { const p = this.players.get(pid); if (!p) return; if (!p.bot) this.net.priv(pid, { t: 'kicked' }); this.players.delete(pid); this.renderPlayers(); this.publishSoon(); },
  addBots(n = 3) {
    const used = new Set([...this.players.values()].map(p => p.name));
    for (let i = 0; i < n && this.players.size < 60; i++) {
      const base = shuffle(BOT_NAMES).find(b => !used.has(b)) || pick(BOT_NAMES); used.add(base);
      const pid = 'bot-' + uid();
      this.players.set(pid, { pid, tok: '', name: this.uniqueName(base), av: randomAv(), score: 0, streak: 0, best: 0, correct: 0, inv: [], hide: [], result: null, draft: null, picked: false, lastPick: null, seen: Date.now(), bot: true });
    }

  },
  scheduleBots() {
    const T = this.settings.time * 1000;
    for (const p of this.players.values()) {
      if (!p.bot) continue;
      if (this.settings.powers && p.inv.length && Math.random() < 0.45) this.botT.push(setTimeout(() => this.onUse(p, { qi: this.qi, pw: pick(p.inv) }), rnd(0.08, 0.2) * T));
      this.botT.push(setTimeout(() => this.botAnswer(p), rnd(0.25, 0.85) * T));
    }
  },
  botAnswer(p) {
    if (this.phase !== 'question') return;
    const q = this.questions[this.qi], a = this.answers.get(p.pid);
    const avail = [0, 1, 2, 3].filter(i => !p.hide.includes(i) && !(a && a.wrong === i));
    const wrong = avail.filter(i => i !== q.a);
    const c = (Math.random() < 0.62 || !wrong.length) ? q.a : pick(wrong);
    this.onAnswer(p, { qi: this.qi, c, att: a ? a.attempts : 0 });
    const a2 = this.answers.get(p.pid); if (a2 && !a2.final) this.botT.push(setTimeout(() => this.botAnswer(p), 1300));
  },

  /* ---- rendering ---- */
  render() { const m = { lobby: 'renderLobby', intro: 'renderIntro', question: 'renderQuestion', reveal: 'renderReveal', board: 'renderBoard', podium: 'renderPodium' }[this.phase]; if (m) this[m](); },
  hbar() {

  frame(main, foot) { app.innerHTML = `<div class="host screen">${this.hbar()}${main}<footer class="hfoot">${foot}</footer></div>`; },
  renderLobby() {

        <div class="pcloud" id="pcloud"></div>

    </main>`, `<span class="hint">Press <kbd>Space</kbd> to start</span><span class="spacer"></span>
      <button class="btn ghost" data-act="h-bots">${ICON.bot} Add 3 practice bots</button>

  },
  async renderQR() {

  renderPlayers() {

  renderIntro() {

  tilesHTML(q, reveal) {

  renderQuestion() {

  drawRing(rem) {

  updateLive() { const b = $('#ansCount'); if (b) { b.textContent = this.answeredCount(); $('#ansOf').textContent = `of ${this.players.size} answered`; } },
  renderFeed() {

  },
  showPP() { const s = $('#ppSlot'); if (s && !s.innerHTML) s.innerHTML = `<div class="pp-banner">${PW_ICON.powerplay}<span><b dir="auto">${esc(this.powerplay)}</b> started a Power Play: +50% for everyone!</span></div>`; },
  renderReveal() {

    this.frame(`<main class="hq">
      <div class="hq-meta">${catChip(q.cat)}<span class="hq-num">Question ${this.qi + 1} of ${this.questions.length}</span></div>
      <div class="hq-card"><h2 class="hq-text">${fmtQ(q.q)}</h2></div>
      ${this.tilesHTML(q, true)}

      <button class="btn xl" data-act="h-next">${last ? 'Final results' : 'Leaderboard'} ${ICON.next}</button>`);
  },
  renderBoard() {
    const r = this.ranked(), top = r.slice(0, 8);
    const rows = top.map((p, i) => {
      const prev = this.prevRank.get(p.pid), mv = prev ? prev - (i + 1) : 0, g = p.result ? p.result.gained : 0;
      return `<li class="row ${i < 3 ? 'r' + (i + 1) : ''}" style="animation-delay:${i * 0.07}s">
        <span class="rk">${i + 1}</span><span class="rav">${avatarSVG(p.av)}</span>
        <span class="rn"><span dir="auto">${esc(p.name)}</span>${p.streak >= 2 ? `<span class="flame">${ICON.flame}${p.streak}</span>` : ''}${mv > 0 ? `<span class="mv">▲${mv}</span>` : mv < 0 ? `<span class="mv down">▼${-mv}</span>` : ''}</span>

      : `<aside class="side-card"><h3>Next up</h3><p>Question ${this.qi + 2} of ${this.questions.length}</p></aside>`;

      `<span class="hint"><kbd>Space</kbd> next question</span><span class="spacer"></span><button class="btn xl" data-act="h-next">Next question ${ICON.next}</button>`);

  },
  countUp() {
    const els = $$('.sc[data-to]'); if (!els.length) return; const t0 = performance.now(), D = 1100;
    const step = now => { const k = Math.min(1, (now - t0) / D), e = 1 - Math.pow(1 - k, 3); els.forEach(el => { const a = +el.dataset.from, b = +el.dataset.to; el.textContent = fmtN(a + (b - a) * e); }); if (k < 1 && this.phase === 'board') requestAnimationFrame(step); };

  },
  updateDraft() {

  },
  renderPodium() {

      <h2 class="podium-title">Final results</h2>
      <div class="podium">${pod(top[0], 2)}${pod(top[1], 1)}${pod(top[2], 3)}</div>
      ${r.length > 3 ? `<div class="rest">${r.slice(3, 20).map((p, i) => `<span>${i + 4}. <b dir="auto">${esc(p.name)}</b> ${fmtN(p.score)}</span>`).join('')}</div>` : ''}
      <div class="stats"><div class="stat"><b>${Math.round(acc * 100)}%</b><span>class accuracy</span></div><div class="stat"><b>${this.qPlayed}</b><span>questions played</span></div>${hardest ? `<div class="stat"><b>${Math.round(hardest.pct * 100)}%</b><span>on the toughest: “${esc(hardest.text.replace(/___/g, '…'))}”</span></div>` : ''}</div>
    </main>`, `<button class="btn ghost" data-act="h-new">New game</button><span class="spacer"></span><button class="btn xl" data-act="h-again">${ICON.play} Play again</button>`);
    Sound.play('drum');
    const show = (id, d) => this.podT.push(setTimeout(() => { const el = $('#pod' + id); if (el) el.classList.add('show'); }, d));
    show(3, 700); show(2, 1500); show(1, 2500);
    this.podT.push(setTimeout(() => { Sound.play('fanfare'); Confetti.burst(220); }, 2600));
    this.podT.push(setTimeout(() => Confetti.burst(140), 4200));
  },
};

/* =========================================================

const Player = {
  active: false, net: null, code: '', pid: null, tok: null, name: '', av: null, pub: null, me: null, hs: null, seq: 0,
  view: '', lastHost: 0, deadline: 0, raf: 0, loopT: 0, pending: null, pendingUse: null, pendingPick: null, localAns: null, tab: 's', glitchT: 0, scrT: 0, joined: false, waitPub: null,

  stop() { if (!this.active) return; this.active = false; cancelAnimationFrame(this.raf); clearInterval(this.loopT); clearTimeout(this.waitPub); try { this.net && this.net.leave(); } catch (e) {} this.endGlitch(); },
  start(prefill) {
    Host.stop(); Game.clear(); Game.phase = 'off'; this.stop(); this.active = true; this.joined = false; this.pub = null; this.me = null; this.hs = null; this.seq = 0; this.view = '';

  },
  renderCode(prefill, err = '') {

      </div></div>`;
    const inp = $('#codeIn');
    inp.addEventListener('input', () => { inp.value = inp.value.toUpperCase().replace(/[^A-Z]/g, '').slice(0, 4); });

    if (prefill.length === 4) this.find(prefill); else setTimeout(() => inp.focus(), 50);
  },
  async find(code) {

    err.textContent = ''; btn.disabled = true; btn.innerHTML = 'Looking for the game…';
    const fail = msg => { if (!this.active) return; btn.disabled = false; btn.innerHTML = `Find game ${ICON.next}`; err.textContent = msg; };
    const net = this.net = App.getNet(); this.code = code; this.pub = null; this.hs = null; this.seq = 0;

    const saved = tabStore.get('ce-seat') || {};

    const probe = () => net.toHost(this.pid, { t: 'probe' });
    probe(); const pt = setInterval(probe, 1500);
    clearTimeout(this.waitPub);
    await new Promise(res => { this.gotPub = res; this.waitPub = setTimeout(res, 10000); });
    clearInterval(pt); clearTimeout(this.waitPub); this.gotPub = null;
    if (!this.active) return;
    if (!this.pub) { fail(`No game found with the code ${code}. Check the big screen and try again.`); return; }
    if (this.pub.phase === 'closed') { fail('That game has ended. Ask the host for the new code.'); return; }
    this.renderCreate();
  },
  renderCreate() {
    this.view = 'create';
    const tabs = [['s', 'Body'], ['c', 'Color'], ['e', 'Eyes'], ['m', 'Mouth'], ['h', 'Hat'], ['x', 'Extras']];
    app.innerHTML = `<div class="pwrap">
      <div class="ptop"><span class="code-chip">Game <b>${esc(this.code)}</b></span></div>
      <h1 class="bigtitle" style="text-align:center">Make your character</h1>
      <div class="spot"><span class="avw bob" id="avPrev">${avatarSVG(this.av)}</span></div>
      <div id="createForm" style="display:flex;flex-direction:column;gap:14px">
        <label class="eyebrow" for="nameIn">Your username</label>
        <div class="name-row"><input class="text-input" id="nameIn" maxlength="16" autocomplete="off" spellcheck="false" dir="auto" placeholder="e.g. Mighty Comma" value="${esc(this.name)}"><button type="button" class="dice" data-act="p-randname" aria-label="Random username">${ICON.dice}</button></div>
        <p class="err" id="nameErr" role="alert"></p>
        <div class="tabs" role="tablist" aria-label="Customize">${tabs.map(([k, l]) => `<button type="button" role="tab" aria-selected="${this.tab === k}" data-act="p-tab" data-k="${k}">${l}</button>`).join('')}</div>
        <div class="opts" id="opts" role="tabpanel"></div>
        <div class="row-btns"><button type="button" class="btn ghost" data-act="p-randav">${ICON.dice} Surprise me</button><button type="button" class="btn pink" id="joinBtn" data-act="p-join">I'm ready ${ICON.next}</button></div>
      </div></div>`;
    this.renderOpts();
    const ni = $('#nameIn');
    ni.addEventListener('input', e => { this.name = e.target.value; $('#nameErr').textContent = ''; });
    ni.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); if (!$('#joinBtn').disabled) this.join(); } });
  },
  renderOpts() {
    const k = this.tab, list = AV[AV_KEYS[k]], box = $('#opts'); if (!box) return;
    box.innerHTML = list.map((v, i) => {
      const on = this.av[k] === i;
      if (k === 'c') return `<button type="button" class="opt sw" aria-pressed="${on}" aria-label="Color ${i + 1}" data-act="p-opt" data-i="${i}"><i style="--sc:${v}"></i></button>`;
      const av = { ...this.av, [k]: i };

    }).join('');
  },
  setAv(av) { this.av = sanitizeAv(av); const p = $('#avPrev'); if (p) p.innerHTML = avatarSVG(this.av); this.renderOpts(); },
  join() {
    const n = cleanName($('#nameIn').value);
    if (n.length < 2) { $('#nameErr').textContent = 'Use at least 2 letters.'; return; }
    if (!NAME_OK.test(n)) { $('#nameErr').textContent = 'Use letters, numbers and spaces only.'; return; }
    this.name = n; store.set('ce-player', { name: n, av: this.av }); tabStore.set('ce-seat', { code: this.code, pid: this.pid, tok: this.tok });
    const btn = $('#joinBtn'); btn.disabled = true; btn.textContent = 'Joining…';
    this.joined = true; this.hello();
    clearInterval(this.loopT); this.loopT = setInterval(() => this.maintain(), 1500); this.lastHost = Date.now();
    setTimeout(() => { if (this.active && !this.me && btn.isConnected) { btn.disabled = false; btn.innerHTML = `Try again ${ICON.next}`; $('#nameErr').textContent = 'The host didn’t answer. Try again.'; this.joined = false; } }, 8000);
    keepAwake();
  },
  hello() { this.net.toHost(this.pid, { t: 'hello', tok: this.tok, name: this.name, av: this.av }); },
  send(m) { this.net.toHost(this.pid, { ...m, tok: this.tok }); },
  maintain() {
    if (!this.active || !this.joined) return;
    this.tick = (this.tick || 0) + 1;
    if (!this.me) this.hello();
    else if (this.tick % 3 === 0) this.send({ t: 'ping' });
    const s = this.pub, me = this.me;
    if (s && me) {
      if (this.pending && s.phase === 'question' && s.qi === this.pending.qi && !me.answered && me.att === this.pending.att) this.send({ t: 'answer', qi: this.pending.qi, c: this.pending.c, att: this.pending.att });
      if (this.pendingUse && s.phase === 'question' && s.qi === this.pendingUse.qi && !me.used) this.send({ t: 'use', qi: s.qi, pw: this.pendingUse.pw });
      if (this.pendingPick && s.phase === 'board' && s.qi === this.pendingPick.qi && !me.picked) this.send({ t: 'pick', qi: s.qi, i: this.pendingPick.i });
    }
    const lost = Date.now() - this.lastHost > 12000; let bar = $('#netbar');
    if (lost && !bar) { bar = document.createElement('div'); bar.id = 'netbar'; bar.className = 'netbar'; bar.textContent = 'Lost the host. Reconnecting…'; document.body.appendChild(bar); }
    if (!lost && bar) bar.remove();
  },
  onEnv(env) {
    if (!this.active) return;
    if (env.k === 'pub') {
      const s = env.s; if (!s || typeof s !== 'object') return;
      if (s.hs !== this.hs) { if (this.hs && this.joined && this.me) { this.me = null; this.view = ''; } this.hs = s.hs; this.seq = 0; }
      if (!(s.seq > this.seq)) return; this.seq = s.seq; this.lastHost = Date.now();

      if (this.gotPub) { this.gotPub(); return; }
      if (s.phase === 'question') { const dl = Date.now() + (s.remain || 0); if (!prev || prev.qi !== s.qi || prev.phase !== 'question' || Math.abs(dl - this.deadline) > 1500) this.deadline = dl; }

    } else if (env.k === 'priv') {
      let m = null; if (env.b && typeof env.b === 'object') m = env.b[this.pid]; else if (env.to === this.pid) m = env.m;

  },
  onPriv(m) {
    if (m.t === 'kicked') { this.joined = false; tabStore.set('ce-seat', {}); this.stop(); this.renderEnd('You were removed from the game', 'Ask the host if you think this was a mistake.'); return; }
    if (m.t === 'full') { this.joined = false; this.renderEnd('This game is full', 'The lobby can take 60 players.'); this.stop(); return; }
    if (m.t !== 'me' || !this.joined) return;
    const prev = this.me; this.me = m;
    if (this.pending && (m.qi !== this.pending.qi || m.answered || m.att > this.pending.att)) {
      if (m.retry && m.qi === this.pending.qi && !m.answered) { this.localAns = null; vibrate([40, 40, 40]); }
      this.pending = null;
    }
    if (this.pendingUse && (m.used || m.qi !== this.pendingUse.qi)) this.pendingUse = null;
    if (this.pendingPick && (m.picked || m.qi !== this.pendingPick.qi)) this.pendingPick = null;
    if (prev && prev.result == null && m.result) { Sound.play(m.result.ok ? 'correct' : 'wrong'); vibrate(m.result.ok ? 60 : [80, 60, 80]); }
    this.name = m.name; this.av = m.av;
    this.update();
  },
  onFx(f) {
    if (f.type === 'glitch' && f.from !== this.pid) { toast(`<b dir="auto">${esc(f.name)}</b> glitched your screen!`, POWERUPS.glitch.color, PW_ICON.glitch); this.startGlitch(); }
    else if (f.type === 'powerplay') { toast(`<b dir="auto">${esc(f.name)}</b> started a Power Play: +50% for everyone!`, POWERUPS.powerplay.color, PW_ICON.powerplay); Sound.play('power'); }
    else if (f.type === 'gift' && f.toPid === this.pid) { toast(`<b dir="auto">${esc(f.name)}</b> gave you 200 points!`, POWERUPS.gift.color, PW_ICON.gift); Sound.play('join'); }
  },
  startGlitch() {
    if (reduceMotion) return; document.body.classList.add('glitching'); Sound.play('glitch'); vibrate([30, 30, 30, 30, 30]);
    const glyphs = '#%&@$*!?<>/\\=+~';
    clearInterval(this.scrT); clearTimeout(this.glitchT);
    this.scrT = setInterval(() => $$('.ans-text,.pq-text').forEach(el => { if (el.dataset.orig == null) el.dataset.orig = el.innerHTML; const txt = el.textContent; el.textContent = [...txt].map(ch => ch !== ' ' && Math.random() < 0.28 ? glyphs[ri(glyphs.length)] : ch).join(''); }), 160);
    this.glitchT = setTimeout(() => this.endGlitch(), 5000);
  },
  endGlitch() { clearInterval(this.scrT); clearTimeout(this.glitchT); document.body.classList.remove('glitching'); $$('[data-orig]').forEach(el => { el.innerHTML = el.dataset.orig; delete el.dataset.orig; }); },
  viewKey() {
    const s = this.pub, m = this.me; if (!s || !m) return 'none';
    const la = this.localAns && this.localAns.qi === s.qi && s.phase === 'question';
    const late = ['reveal', 'board', 'podium'].includes(s.phase) ? m.rank + ':' + m.n + ':' + !!m.stats + ':' + (m.lastPick || '') : '';
    return [s.hs, s.phase, s.qi, m.answered || la, m.retry && !la, m.used || (this.pendingUse ? this.pendingUse.pw : ''), (m.hide || []).join(','), m.draft ? m.draft.join(',') : '', m.picked || !!this.pendingPick, (m.inv || []).join(','), !!m.result, late].join('|');
  },
  update() {
    if (!this.me || !this.pub) return;
    const k = this.viewKey();
    if (k !== this.view) { this.view = k; this.renderPhase(); }

  partial() { const p = $('#ptsNum'); if (p) p.textContent = fmtN(this.me.score); const n = $('#lobbyN'); if (n) n.textContent = this.pub.n; },
  ptop() {

  renderPhase() {

  renderGetReady() {

    else if (!picked) body = `<h1 class="bigtitle">Pick a power-up</h1><p class="sub">${m.inv.length >= 3 ? 'Your pack is full, so your oldest power-up will be swapped out.' : 'It goes into your pack for the next questions.'}</p><div class="cards">${m.draft.map((id, i) => pwCard(id, `data-act="p-pick" data-i="${i}"`)).join('')}</div>`;
    else { const id = m.lastPick || (this.pendingPick && m.draft[this.pendingPick.i]); body = `<h1 class="bigtitle">Added to your pack!</h1>${id ? `<div class="cards">${pwCard(id, '', 'div')}</div>` : ''}<p class="sub">You're ${ordinal(m.rank)} of ${m.n}. Next question soon…</p>`; }
    app.innerHTML = `<div class="pwrap">${this.ptop()}<div class="center">${body}</div>${s.powers ? this.packHTML(false) : ''}</div>`;
  },
  renderFinal() {
    const m = this.me, st = m.stats || { correct: 0, total: 0, best: 0 };
    const mc = m.rank === 1 ? '#FFC42E' : m.rank === 2 ? '#DDE3F0' : m.rank === 3 ? '#F09A5B' : '#fff';
    const title = m.rank === 1 ? 'You won!' : m.rank <= 3 ? 'On the podium!' : 'Great game!';
    app.innerHTML = `<div class="pwrap">${this.ptop()}<div class="center">
      <div class="spot"><span class="avw bob">${avatarSVG(m.av)}</span></div>
      <div class="medal" style="--mc:${mc}">${m.rank}</div>
      <h1 class="bigtitle">${title}</h1>
      <p class="sub">You finished ${ordinal(m.rank)} of ${m.n} with <b style="color:#fff">${fmtN(m.score)}</b> points.</p>
      <div class="lines"><div><span>Correct answers</span><b>${st.correct} of ${st.total}</b></div><div><span>Best streak</span><b>${st.best}</b></div></div>
      <p class="sub">Stay here. If the host starts another round, you're already in.</p>
    </div></div>`;
    if (m.rank <= 3) Confetti.burst(120);
  },
  renderEnd(title, text) {
    this.view = 'end';
    app.innerHTML = `<div class="pwrap"><div class="center"><h1 class="bigtitle">${esc(title)}</h1><p class="sub">${esc(text)}</p><button class="btn xl" data-act="go-join">Join another game</button><button class="link-back" style="align-self:center" data-act="go-home">Home</button></div></div>`;
  },
  openSheet(id) {
    const p = POWERUPS[id]; this.closeSheet();
    const wrap = document.createElement('div'); wrap.id = 'sheetWrap';
    wrap.innerHTML = `<div class="sheet-back" data-close="1"></div><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetT">
      ${pwCard(id, '', 'div').replace('<b>', '<b id="sheetT">')}
      <div class="row-btns"><button class="btn ghost" data-close="1">Keep it</button><button class="btn" id="useBtn">Use it now</button></div></div>`;
    document.body.appendChild(wrap);
    wrap.addEventListener('click', e => { if (e.target.closest('[data-close]')) this.closeSheet(); });
    $('#useBtn').addEventListener('click', () => { this.closeSheet(); this.usePower(id); });
    $('#useBtn').focus();
  },
  closeSheet() { const w = $('#sheetWrap'); if (w) w.remove(); },
  usePower(id) {
    const s = this.pub, m = this.me; if (!s || s.phase !== 'question' || m.used || this.pendingUse || m.answered) return;
    this.pendingUse = { qi: s.qi, pw: id }; this.send({ t: 'use', qi: s.qi, pw: id }); Sound.play('power'); vibrate(40); this.update();
  },
};
Actions['p-find'] = () => { const i = $('#codeIn'); if (i) Player.find(i.value); };
Actions['p-join'] = () => Player.join();
Actions['p-randname'] = () => { const n = randomName(); Player.name = n; const i = $('#nameIn'); if (i) i.value = n; Sound.play('tap'); };
Actions['p-tab'] = el => { Player.tab = el.dataset.k; $$('.tabs [role=tab]').forEach(b => b.setAttribute('aria-selected', b === el)); Player.renderOpts(); };
Actions['p-opt'] = el => { Player.setAv({ ...Player.av, [Player.tab]: +el.dataset.i }); Sound.play('tap'); };
Actions['p-randav'] = () => { Player.setAv(randomAv()); Sound.play('join'); };
Actions['p-wave'] = () => { Player.send({ t: 'wave' }); const a = $('#waveAv'); if (a) { a.classList.remove('bob'); a.style.animation = 'jump .7s ease-out'; setTimeout(() => { a.style.animation = ''; a.classList.add('bob'); }, 700); } vibrate(30); };
Actions['p-edit'] = () => { Player.joined = false; Player.me = null; Player.view = 'create'; Player.renderCreate(); };
Actions['p-sound'] = el => { Sound.ensure(); Sound.on = !Sound.on; el.innerHTML = Sound.on ? ICON.soundOn : ICON.soundOff; el.setAttribute('aria-label', Sound.on ? 'Turn sound off' : 'Turn sound on'); };
Actions['p-power'] = el => Player.openSheet(el.dataset.id);
Actions['p-answer'] = el => {
  const P = Player, s = P.pub, m = P.me; if (!s || s.phase !== 'question' || !m || m.answered) return;
  const c = +el.dataset.i, att = m.att || 0;
  P.pending = { qi: s.qi, c, att }; P.localAns = { qi: s.qi, c };
  P.send({ t: 'answer', qi: s.qi, c, att }); Sound.play('tap'); vibrate(30); P.update();
};
Actions['p-pick'] = el => {
  const P = Player, s = P.pub, m = P.me; if (!s || s.phase !== 'board' || !m || !m.draft || m.picked || P.pendingPick) return;
  P.pendingPick = { qi: s.qi, i: +el.dataset.i }; P.send({ t: 'pick', qi: s.qi, i: +el.dataset.i }); Sound.play('power'); vibrate(40); P.update();
};


App.init();
</script>

</body>
